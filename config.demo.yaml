gateway:
  name: Knowledge Gateway
  version: 1.1.0
  host: 127.0.0.1
  port: 8080
  debug: false
  pagination:
    default_page_size: 5
    max_page_size: 50
  onnx_engine:
    enabled: true
    model_path: models/reranker.onnx
    score_threshold: 0.15
  demo_mode: true
  source_timeout_seconds: 8
  max_concurrent_queries: 16
  queue_timeout_seconds: 0.25
cache:
  enabled: true
  backend: memory
  ttl_seconds: 300
  eviction_policy: lru
  max_entries: 1000
  redis:
    host: localhost
    port: 6379
    db: 0
    password: ${REDIS_PASSWORD:-}
    timeout_seconds: 0.5
    key_prefix: 'kg:cache:'
    retry_interval_seconds: 5.0
  max_value_bytes: 2097152
rag:
  enabled: true
  provider: qdrant
  host: localhost
  port: 6333
  collection: enterprise_knowledge_rag
  top_k: 8
  embedding:
    openai_url: https://openrouter.ai/api/v1
    model_id: openai/text-embedding-3-small
    api_key: ''
    dimension: 768
    provider: deterministic
    timeout_seconds: 4
    send_dimensions: true
  mode: memory
  timeout_seconds: 3
okf:
  enabled: true
  root_dir: data/okf
  deterministic_traversal: true
  top_k: 8
filesystem:
  enabled: true
  directories:
  - path: data/docs
    patterns:
    - '*.md'
    - '*.txt'
    - '*.json'
  - path: data/specs
    patterns:
    - '*.md'
    - '*.txt'
    - '*.yaml'
  max_results: 8
git:
  enabled: true
  repositories:
  - name: knowledge-gateway
    path: .
    branch: main
    max_commits: 15
    max_results: 6
sql:
  enabled: false
  provider: postgresql
  host: localhost
  port: 5433
  database: gateway_db
  username: postgres_admin
  password: ${POSTGRES_PASSWORD:-}
  timeout_seconds: 4.0
  tables:
  - table_name: knowledge_articles
    search_columns:
    - title
    - content
    - category
    - tags
  - table_name: system_configs
    search_columns:
    - config_key
    - config_value
    - description
    - scope
  max_results: 8
security:
  api_key: ${KNOWLEDGE_GATEWAY_API_KEY:-}
  cors_origins: []
  allowed_hosts:
  - localhost
  - 127.0.0.1
  - '[::1]'
  - testserver
