gateway:
  name: "Knowledge Gateway"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8080
  debug: true
  pagination:
    default_page_size: 5
    max_page_size: 50
  onnx_engine:
    enabled: true
    model_path: "models/reranker.onnx"
    score_threshold: 0.15
    weights:
      semantic_sim: 0.35
      lexical_overlap: 0.20
      title_match: 0.20
      tag_match: 0.10
      source_confidence: 0.15

# Caching Layer (Redis with automatic In-Memory fallback, TTL, and Eviction policies)
cache:
  enabled: true
  backend: "redis" # Options: "redis" or "memory"
  ttl_seconds: 300 # Default TTL: 5 minutes
  eviction_policy: "lru" # Options: "lru", "lfu", "fifo"
  max_entries: 1000 # Maximum cache capacity
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: ""
    timeout_seconds: 2.0
    key_prefix: "kg:cache:"

# Connectors Configuration

# 1. RAG Vector Database
rag:
  enabled: true
  provider: "qdrant"
  host: "localhost"
  port: 6333
  collection: "enterprise_knowledge_rag"
  top_k: 8
  embedding:
    # OpenAI-compatible embedding endpoint configuration
    openai_url: "https://openrouter.ai/api/v1"
    model_id: "openai/text-embedding-3-small"
    api_key: "${OPENROUTER_API_KEY}"
    dimension: 768

# 2. OKF (Open Knowledge Format) Structured Point
okf:
  enabled: true
  root_dir: "data/okf"
  deterministic_traversal: true
  top_k: 8

# 3. Filesystem Source
filesystem:
  enabled: true
  directories:
    - path: "data/docs"
      patterns: ["*.md", "*.txt", "*.json"]
    - path: "data/specs"
      patterns: ["*.md", "*.txt", "*.yaml"]
  max_results: 8

# 4. Git Repository Source
git:
  enabled: true
  repositories:
    - name: "knowledge-gateway"
      path: "."
      branch: "main"
      max_commits: 15
      max_results: 6

# 5. SQL Database (PostgreSQL / MySQL / Relational Database)
sql:
  enabled: true
  provider: "postgresql"
  host: "localhost"
  port: 5433
  database: "gateway_db"
  username: "postgres_admin"
  password: "postgres_secret"
  timeout_seconds: 4.0
  tables:
    - table_name: "knowledge_articles"
      search_columns: ["title", "content", "category", "tags"]
      id_column: "id"
      title_column: "title"
      content_column: "content"
    - table_name: "system_configs"
      search_columns: ["config_key", "config_value", "description", "scope"]
      id_column: "id"
      title_column: "config_key"
      content_column: "description"
  max_results: 8
