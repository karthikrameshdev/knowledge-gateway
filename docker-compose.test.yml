services:
  weftkit_postgres:
    image: postgres:16-alpine
    container_name: weftkit_test_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: weftkit_db
      POSTGRES_USER: weftkit_admin
      POSTGRES_PASSWORD: weftkit_secret
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init-weftkit-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weftkit_admin -d weftkit_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: weftkit_test_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 3s
      timeout: 3s
      retries: 10
